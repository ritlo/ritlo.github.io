# About Section
about_title: About Me
about_profile_image: images/profile.png
about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Ritvick and I'm currently a Third Year Undergraduate Student at Delhi Technological University, majoring in Electronics and Communications Engineering. From a young age I have been fascinated by computers and software. My main interests are in Software Development and the Internet of Things.

  

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: Internet Enabled Fire Alarm
        # link: github.com/ritlo
        # # link_text: Project Website
        # additional_links:
        #   - title:  ritlo
        #     icon: fab fa-github
        #     url: github.com/ritlo
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          Within seconds of detecting a flame, a signal is sent to all registered Android devices via the Internet. 
        description: | # this will include new lines to allow paragraphs
          This was one of my first projects which I made with the Raspberry Pi and involved writing code in Python, as well as learning to write a simple Android app. The program uses Firebase APIs to notify all Android devices that have the app installed and registered to the system.
      - layout: top-middle
        title: Customer Engagement Database
        # link: github.com/ritlo
        # # link_text: Project Website
        # additional_links:
        #   - title:  ritlo
        #     icon: fab fa-github
        #     url: github.com/ritlo
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          A system to allow small business chains to collect data on their customers and enhance profits. 
        description: | # this will include new lines to allow paragraphs
          This is a project that I am currently working on which intends to help business owners collect information about the customers visiting across their entire network of store locations. 

          In its current form the program is written in Java and using a motion sensor is able to maintain a database of the number of customers visiting each store location. The collected data may be viewed depending on whether the currently logged in account has the required authorization. The program also  dynamically changes to a smartphone based security system during closing hours.

          I intend to continue work on the project to allow it to collect other types of customer demographic information and also analyze the collected data to suggest decision that the business can take to increase profits.
          
